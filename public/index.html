<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Recognition Attendance System</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#2563eb;--ok:#16a34a;--er:#dc2626;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mu:#9aa3b2;--bd:#2a2f3a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button,input{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p,.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
button.d{color:var(--er)}input{width:100%;margin-bottom:10px}
video{width:100%;max-width:480px;border-radius:10px;background:#000;display:block;margin:0 auto 10px;transform:scaleX(-1)}
#status{text-align:center;font-weight:600;min-height:24px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:.92rem}
.ok{color:var(--ok)}.er{color:var(--er)}.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 Face Recognition Attendance System</h1>

  <div id="login" class="card">
    <input id="pw" type="password" placeholder="Admin password">
    <button class="p" onclick="login()">Log in</button>
    <span id="lerr" class="er"></span>
  </div>

  <div id="app" class="hide">
    <div class="tabs" id="tabs">
      <button data-t="scan" class="on">Scan</button>
      <button data-t="register">Register</button>
      <button data-t="students">Students</button>
      <button data-t="report">Attendance</button>
    </div>

    <div class="card" id="camcard">
      <video id="v" autoplay muted playsinline></video>
      <div id="status">Loading face recognition... please wait.</div>
    </div>

    <div class="card hide" id="p-register">
      <input id="rn" placeholder="Roll No">
      <input id="nm" placeholder="Full Name">
      <button class="p" id="regbtn" onclick="register()">Capture &amp; Register</button>
      <p class="mu">Look straight at the camera in good lighting. Three quick samples will be captured.</p>
    </div>

    <div class="card hide" id="p-students"><table id="stt"></table></div>

    <div class="card hide" id="p-report">
      <div class="row"><input type="date" id="dt" style="width:auto;margin:0"><button onclick="loadReport()">Load</button><button onclick="csv()">Export CSV</button></div>
      <h3>Present <span id="pc"></span></h3><table id="prt"></table>
      <h3>Absent <span id="ac"></span></h3><table id="abt"></table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const $ = s => document.querySelector(s), v = $('#v');
const MODEL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
let KEY = sessionStorage.getItem('k') || '', students = [], matcher = null, mode = 'scan', busy = false, done = new Set(), booted = false, lastRows = [];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = (t, c = '') => { $('#status').textContent = t; $('#status').className = c; };
const tm = d => new Date(d).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' });

async function api(path, opt = {}) {
  const r = await fetch('/api/' + path, { ...opt, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Server error');
  return j;
}

async function login() {
  KEY = $('#pw').value;
  try { await api('students'); sessionStorage.setItem('k', KEY); start(); }
  catch (e) { $('#lerr').textContent = e.message; }
}

async function start() {
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#dt').value = TODAY;
  if (booted) return; booted = true;
  try {
    try { await faceapi.tf.setBackend('webgl'); } catch (_) {}
    await faceapi.tf.ready();
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)]);
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    await v.play();
    await loadStudents();
    status('Ready. Please look at the camera.', 'mu');
    setInterval(scanLoop, 800);
  } catch (e) {
    const m = e.name === 'NotAllowedError' ? 'Camera access was blocked. Please allow camera permission in your browser and refresh the page.'
      : e.name === 'NotFoundError' ? 'No camera was found on this device.'
      : 'Something went wrong while starting: ' + e.message;
    status(m, 'er');
  }
}

async function loadStudents() {
  students = await api('students');
  matcher = students.length ? new faceapi.FaceMatcher(
    students.map(s => new faceapi.LabeledFaceDescriptors(s.id, [new Float32Array(s.descriptor)])), 0.5) : null;
}

const cv = document.createElement('canvas');
async function detect() {
  if (!v.videoWidth) return null;
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  return faceapi.detectSingleFace(cv, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 }))
    .withFaceLandmarks().withFaceDescriptor();
}

async function scanLoop() {
  if (mode !== 'scan' || busy || !booted) return;
  busy = true;
  try {
    const d = await detect();
    if (!d) status('No face detected. Move closer, face the camera and make sure the room is well lit.', 'mu');
    else if (!matcher) status('No students are registered yet. Please register someone first.', 'er');
    else {
      const m = matcher.findBestMatch(d.descriptor);
      if (m.label === 'unknown') status('Face not recognized. Please register first or try again.', 'er');
      else {
        const s = students.find(x => x.id === m.label);
        if (!done.has(s.id)) {
          const r = await api('attendance', { method: 'POST', body: JSON.stringify({ student_id: s.id }) });
          done.add(s.id);
          status(r.already ? `${s.name}, your attendance is already marked for today.` : `✅ Welcome, ${s.name}! Your attendance has been marked.`, r.already ? 'mu' : 'ok');
        } else status(`${s.name}, your attendance is already marked for today.`, 'mu');
      }
    }
  } catch (e) { status(e.message, 'er'); }
  busy = false;
}

async function register() {
  const roll_no = $('#rn').value.trim(), name = $('#nm').value.trim();
  if (!roll_no || !name) return status('Please enter both Roll No and Name.', 'er');
  busy = true; $('#regbtn').disabled = true;
  try {
    const samples = [];
    for (let i = 0; i < 3; i++) {
      status(`Capturing sample ${i + 1} of 3... please hold still.`);
      let d = null;
      for (let t = 0; t < 8 && !d; t++) { d = await detect(); if (!d) await new Promise(r => setTimeout(r, 400)); }
      if (!d) throw new Error('We could not detect your face. Please look straight at the camera in good lighting and try again.');
      samples.push(d.descriptor);
      await new Promise(r => setTimeout(r, 500));
    }
    const avg = Array.from({ length: 128 }, (_, i) => samples.reduce((a, s) => a + s[i], 0) / samples.length);
    await api('students', { method: 'POST', body: JSON.stringify({ roll_no, name, descriptor: avg }) });
    await loadStudents();
    $('#rn').value = $('#nm').value = '';
    status(`✅ ${name} has been registered successfully.`, 'ok');
  } catch (e) { status(e.message, 'er'); }
  busy = false; $('#regbtn').disabled = false;
}

function renderStudents() {
  $('#stt').innerHTML = '<tr><th>Roll</th><th>Name</th><th></th></tr>' + students.map(s =>
    `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.name)}</td><td><button class="d" onclick="del('${s.id}')">Delete</button></td></tr>`).join('');
}
async function del(id) {
  if (!confirm('Delete this student and all their attendance records? This cannot be undone.')) return;
  await api('students?id=' + id, { method: 'DELETE' }); await loadStudents(); renderStudents();
}

async function loadReport() {
  const date = $('#dt').value || TODAY;
  const rec = await api('attendance?date=' + date);
  const ids = new Set(rec.map(r => r.student_id));
  const absent = students.filter(s => !ids.has(s.id));
  lastRows = [...rec.map(r => [r.students.roll_no, r.students.name, 'Present', tm(r.marked_at)]),
              ...absent.map(s => [s.roll_no, s.name, 'Absent', ''])];
  $('#pc').textContent = `(${rec.length})`; $('#ac').textContent = `(${absent.length})`;
  $('#prt').innerHTML = '<tr><th>Roll</th><th>Name</th><th>Time</th></tr>' + rec.map(r =>
    `<tr><td>${esc(r.students.roll_no)}</td><td>${esc(r.students.name)}</td><td>${tm(r.marked_at)}</td></tr>`).join('');
  $('#abt').innerHTML = '<tr><th>Roll</th><th>Name</th></tr>' + absent.map(s =>
    `<tr><td>${esc(s.roll_no)}</td><td>${esc(s.name)}</td></tr>`).join('');
}
function csv() {
  const rows = [['Roll No', 'Name', 'Status', 'Time'], ...lastRows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows], { type: 'text/csv' }));
  a.download = `attendance-${$('#dt').value || TODAY}.csv`; a.click();
}

$('#tabs').onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  mode = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  ['register', 'students', 'report'].forEach(x => $('#p-' + x).classList.toggle('hide', x !== t));
  $('#camcard').classList.toggle('hide', t === 'students' || t === 'report');
  if (t === 'scan') status('Ready. Please look at the camera.', 'mu');
  if (t === 'students') renderStudents();
  if (t === 'report') loadReport();
};
$('#pw').addEventListener('keydown', e => e.key === 'Enter' && login());
if (KEY) api('students').then(start).catch(() => {});
</script>
</body>
</html>
